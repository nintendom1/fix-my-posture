<!--
  Fix My Posture app icon source. Export with: python3 Design/AppIcon/export-app-icon.py

  The glyph is a modified version of Tabler Icons "body-scan" (icons/outline/body-scan.svg),
  https://github.com/tabler/tabler-icons, Copyright (c) 2020-2026 Paweł Kuna, MIT License.
  See TABLER-LICENSE.txt in this folder.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="base" x1="90" y1="60" x2="960" y2="970" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#120B27"/>
      <stop offset="0.42" stop-color="#211243"/>
      <stop offset="0.74" stop-color="#3A1E73"/>
      <stop offset="1" stop-color="#552CA2"/>
    </linearGradient>

    <radialGradient id="coolLift" cx="0.21" cy="0.16" r="0.72">
      <stop offset="0" stop-color="#4A7CFF" stop-opacity="0.34"/>
      <stop offset="0.40" stop-color="#545CFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#27D8E8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violetLift" cx="0.88" cy="0.80" r="0.70">
      <stop offset="0" stop-color="#A455E7" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#7D3EC9" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7D3EC9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="edgeDepth" cx="0.50" cy="0.45" r="0.74">
      <stop offset="0.62" stop-color="#05030D" stop-opacity="0"/>
      <stop offset="1" stop-color="#05030D" stop-opacity="0.30"/>
    </radialGradient>
  </defs>

  <!-- Full square artwork. iOS applies the app-icon corner mask. -->
  <rect width="1024" height="1024" fill="url(#base)"/>
  <rect width="1024" height="1024" fill="url(#coolLift)"/>
  <rect width="1024" height="1024" fill="url(#violetLift)"/>
  <rect width="1024" height="1024" fill="url(#edgeDepth)"/>

  <!-- Tabler Icons body-scan geometry (MIT), scaled and restyled. -->
  <g transform="translate(140 140) scale(31)"
     fill="none" stroke="#FAF9FF" stroke-width="1.52"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Filled so the thinner stroke leaves no hole in the head. -->
    <path d="M11 8a1 1 0 1 0 2 0a1 1 0 0 0 -2 0" fill="#FAF9FF" />
    <path d="M10 17v-1a2 2 0 1 1 4 0v1" />
    <path d="M8 10q1 1 2 1h4q1 0 2 -1" />
    <path d="M12 11v3" />
    <path d="M3 7v-2a2 2 0 0 1 2 -2h2" />
    <path d="M3 17v2a2 2 0 0 0 2 2h2" />
    <path d="M17 3h2a2 2 0 0 1 2 2v2" />
    <path d="M17 21h2a2 2 0 0 0 2 -2v-2" />
  </g>
</svg>
