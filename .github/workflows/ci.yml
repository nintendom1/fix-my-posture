name: CI Validation

on:
  push:
    # Feature branch pushes are covered by pull_request, including stacked PRs.
    branches: [ main ]
  pull_request:
    # Run for every base branch so stacked PRs are validated too.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Test
    # The same toolchain that builds the app for the phone (`make ios`).
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      # SIMULATOR_DESTINATION is unset, so validate.sh picks the newest installed iPhone simulator.
      - name: Run Validation Script
        run: ./scripts/validate.sh
